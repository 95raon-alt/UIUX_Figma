<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ul과 ol태그에 대해 알아보자!</title>
</head>
<body>
    <h1>ul과 ol태그에 대해 알아보아요~</h1>

    <h2>ul</h2>
    <ul>
        <li>안녕</li>
        <li>나는 ul이고</li>
        <li>나는 순서가 없어~</li>
        <li>히히히~</li>
    </ul>

    <h2>ol</h2>
    <ol>
        <li>안녕</li>
        <li>나는 ol인데</li>
        <li>나는 순서가 있다!</li>
        <li>하하하!</li>
    </ol>

    <h3><mark>h1~h6</mark0></h3>
    <ol>
        <li>h1~h6까지 알아보자~</li>
        <li>h1은 단 한번만 사용할 수 있어!</br>보통 로고에 많이 써!</li>
        <li>h2~h6는 여러번 사용 가능!</li>
        <li>순서대로 가용해야되!</li>
        <li>h1를 사용했는데 h3가 나올 수는 없어~</li>
        <li>잘 기억해놓자~~</li>
    </ol>
</body>
</html>
